/* `sel` is the currently chosen key in this panel, or null. Everything is clickable;
   the chosen one is marked and the rest are dimmed. */
function donutHTML(parts, total, midLabel, sel, attr){
  const R = 48, C = 2*Math.PI*R;
  let off = 0, segs = "";
  parts.forEach(function(p){
    if(!p.n) return;
    const len = total ? C*p.n/total : 0;
    const dim = sel && sel!==p.id;
    segs += '<circle class="seg" data-'+attr+'="'+esc(p.id)+'" cx="60" cy="60" r="'+R+'" fill="none"'
         + ' stroke="'+p.color+'" stroke-width="14" opacity="'+(dim?".3":"1")+'"'
         + ' stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'"'
         + ' stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"><title>'+esc(p.label)+'</title></circle>';
    off += len;
  });
  if(!total) segs = '<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="var(--surface-3)" stroke-width="14"/>';

  return '<div class="donut"><div class="ring"><svg viewBox="0 0 120 120">'+segs+'</svg>'
    + '<div class="mid"><b>'+total+'</b><span>'+midLabel+'</span></div></div>'
    + '<div class="keys">'+parts.map(function(p){
        const on = sel===p.id, dim = sel && !on;
        return '<button class="key'+(on?" on":"")+(dim?" dim":"")+'" data-'+attr+'="'+esc(p.id)+'">'
          + '<em style="background:'+p.color+'"></em>'
          + '<span class="kl">'+esc(p.label)+'</span><span class="kv">'+p.n+'</span></button>';
      }).join("")+'</div></div>';
}

function barListHTML(rows, sel, attr){
  if(!rows.length) return '<div class="dempty">Nada para mostrar.</div>';
  const max = Math.max.apply(null, rows.map(r=>r.total)) || 1;
  return '<div class="barlist">' + rows.map(function(r){
    const on = sel===r.id, dim = sel && !on;
    const segs = r.parts.filter(p=>p.n>0).map(function(p){
      return '<i style="width:'+(p.n/max*100)+'%;background:'+p.color+'"></i>';
    }).join("");
    return '<button class="barrow'+(on?" on":"")+(dim?" dim":"")+'" data-'+attr+'="'+esc(r.id)+'">'
      + '<span class="bl" title="'+esc(r.label)+'">'+esc(r.label)+'</span>'
      + '<span class="bn">'+r.note+'</span>'
      + '<span class="track">'+segs+'</span></button>';
  }).join("") + '</div>';
}

const STATUS_LEGEND = '<div class="legend">'
  + STATUSES.map(s=>'<span><em style="background:'+STATUS_COLOR[s.id]+'"></em>'+s.label+'</span>').join("")
  + '</div>';

function renderDash(){
  const list = scoped();
  const n = list.length;
  const by = {open:0, progress:0, resolved:0};
  list.forEach(t=>{ by[t.status] = (by[t.status]||0)+1; });
  const active = by.open + by.progress;
  const overdue = list.filter(isOverdue);
  const openOnes = list.filter(t=>t.status!=="resolved");

  /* --- scope chips --- */
  const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  const chip = (dim,label) => '<span class="chip">'+esc(label)+'<button data-clear="'+dim+'" title="Quitar este filtro">'+X+'</button></span>';
  const chips = [];
  if(ui.view!=="all")     chips.push(chip("view", viewOf(ui.view).label));
  if(ui.priority!=="all") chips.push(chip("priority", "Prioridad "+pri(ui.priority).label.toLowerCase()));
  if(ui.category!=="all") chips.push(chip("category", catLabel(ui.category)));
  if(ui.building!=="all") chips.push(chip("building", ui.building));
  if(ui.assignee!=="all") chips.push(chip("assignee", assigneeLabel(ui.assignee)));
  $("#dashScope").innerHTML = chips.length
    ? chips.join("") + '<button class="btn ghost" data-clear="everything" style="height:24px;padding:0 9px;font-size:11.5px">Limpiar todo</button>'
    : '<span style="font-size:12px;color:var(--text-3)">Todo — tocá cualquier número de abajo para acotar</span>';
  $("#toListLabel").textContent = chips.length
    ? (n===1 ? "Ver este ticket" : "Ver estos "+n+" tickets")
    : "Ver todos los tickets";

  /* --- KPIs --- */
  const avgOpenAge = avg(openOnes.map(t=>ageDays(t.submitted)));
  const resolved   = list.filter(t=>t.status==="resolved" && t.resolvedAt);
  const avgResolve = avg(resolved.map(t=>daysBetween(t.submitted, t.resolvedAt)));
  const last30     = list.filter(t=>t.status==="resolved" && t.resolvedAt && ageDays(String(t.resolvedAt).slice(0,10)) <= 30).length;
  const new30      = list.filter(t=>ageDays(t.submitted) <= 30).length;
  const oldest     = openOnes.length ? Math.max.apply(null, openOnes.map(t=>ageDays(t.submitted))) : 0;
  const pctOverdue = active ? Math.round(overdue.length/active*100) : 0;

  /* every KPI also picks a filter; `base` ignores the current one so a card is never a dead end */
  const base = subset("view");
  const reach = id => base.filter(viewOf(id).test).length;

  let h = '<div class="kpis">';
  h += kpi("active", "Reclamos activos", active,
           (n? by.resolved+" resueltos de "+n+" en total" : "No hay tickets en este recorte"), "", "", reach("active"));
  h += kpi("attn", "Necesitan atención", overdue.length,
           (active? pctOverdue+"% de los reclamos activos" : "—"), overdue.length?"warn":"", "", reach("attn"));
  h += kpi("active", "Antigüedad promedio, abiertos", avgOpenAge===null?"—":oneDec(avgOpenAge),
           openOnes.length? "sobre "+openOnes.length+" todavía abiertos" : "nada abierto",
           (avgOpenAge!==null && avgOpenAge>14)?"warn":"", avgOpenAge===null?"":"días", reach("active"));
  h += kpi("resolved", "Tiempo promedio de resolución", avgResolve===null?"—":oneDec(avgResolve),
           resolved.length? "sobre "+resolved.length+" resueltos" : "todavía no hay resueltos",
           "", avgResolve===null?"":"días", reach("resolved"));
  h += kpi("resolved30", "Resueltos, últimos 30 días", last30,
           new30+" nuevos en el mismo período", last30?"good":"", "", reach("resolved30"));
  h += kpi("stale", "Reclamo abierto más antiguo", openOnes.length?oldest:"—",
           openOnes.length? "sigue esperando" : "nada abierto",
           oldest>21?"warn":"", openOnes.length?"días":"", reach("stale"));
  h += '</div>';

  h += '<div class="cards">';

  /* Each panel is built from the data with its OWN filter lifted, so the other
     choices stay visible and clickable rather than collapsing to the current slice. */
  const statusSel = ["open","progress","resolved"].indexOf(ui.view)>=0 ? ui.view : null;
  const byStatus  = subset("view");
  h += '<div class="dcard"><div class="dcard-h">Por estado</div><div class="dcard-b">'
    + donutHTML(STATUSES.map(s=>({id:s.id, label:s.label,
        n:byStatus.filter(t=>t.status===s.id).length, color:STATUS_COLOR[s.id]})),
        byStatus.length, byStatus.length===1?"ticket":"tickets", statusSel, "status")
    + '</div></div>';

  /* priority */
  const byPri = subset("priority");
  const priRows = PRIORITIES.map(function(p){
    const set = byPri.filter(t=>t.priority===p.id);
    const un  = set.filter(t=>t.status!=="resolved").length;
    return {id:p.id, label:p.label, total:set.length, note:set.length+(un?"  ·  "+un+" activos":""),
            parts:[{n:un,color:PRI_COLOR[p.id]},{n:set.length-un,color:"var(--surface-3)"}]};
  }).filter(r=>r.total>0);
  h += '<div class="dcard"><div class="dcard-h">Por prioridad</div><div class="dcard-b">'
    + barListHTML(priRows, ui.priority==="all"?null:ui.priority, "pri")
    + '<div class="legend"><span><em style="background:var(--text-2)"></em>Activos</span>'
    + '<span><em style="background:var(--surface-3)"></em>Resueltos</span></div>'
    + '</div></div>';

  /* category */
  const byCat = subset("category");
  const catRows = CATEGORIES.map(function(c){
    const set = byCat.filter(t=>t.category===c);
    return {id:c, label:catLabel(c), total:set.length, note:String(set.length),
            parts:STATUSES.map(s=>({n:set.filter(t=>t.status===s.id).length, color:STATUS_COLOR[s.id]}))};
  }).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
  h += '<div class="dcard"><div class="dcard-h">Reclamos por categoría</div><div class="dcard-b">'
    + barListHTML(catRows, ui.category==="all"?null:ui.category, "cat") + STATUS_LEGEND + '</div></div>';

  /* workload by handler */
  const byWho = subset("assignee");
  const whoRows = assigneeKeys().map(function(k){
    const set = byWho.filter(t=>assigneeKey(t)===k);
    const late = set.filter(isOverdue).length;
    return {id:k, label:assigneeLabel(k), total:set.length,
            note:set.filter(t=>t.status!=="resolved").length+" activos"+(late?"  ·  "+late+" atrasados":""),
            parts:STATUSES.map(s=>({n:set.filter(t=>t.status===s.id).length, color:STATUS_COLOR[s.id]}))};
  }).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
  h += '<div class="dcard"><div class="dcard-h">Carga por responsable</div><div class="dcard-b">'
    + barListHTML(whoRows, ui.assignee==="all"?null:ui.assignee, "who") + STATUS_LEGEND + '</div></div>';

  /* by building */
  const byBld = subset("building");
  const bRows = buildings().map(function(b){
    const set = byBld.filter(t=>buildingOf(t)===b);
    const late = set.filter(isOverdue).length;
    return {id:b, label:b, total:set.length, note:set.length+(late?"  ·  "+late+" atrasados":""),
            parts:STATUSES.map(s=>({n:set.filter(t=>t.status===s.id).length, color:STATUS_COLOR[s.id]}))};
  }).filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
  h += '<div class="dcard"><div class="dcard-h">Reclamos por edificio</div><div class="dcard-b">'
    + barListHTML(bRows, ui.building==="all"?null:ui.building, "bld") + STATUS_LEGEND + '</div></div>';

  /* weekly intake */
  const weeks = [];
  for(let i=7;i>=0;i--){
    const from = i*7 + 6, to = i*7;
    weeks.push({
      label: fmtShort(daysAgoISO(from)),
      n: list.filter(t=>{ const d = ageDays(t.submitted); return d<=from && d>=to; }).length,
      now: i===0
    });
  }
  const wMax = Math.max.apply(null, weeks.map(w=>w.n)) || 1;
  h += '<div class="dcard"><div class="dcard-h">Reclamos nuevos, últimas 8 semanas</div><div class="dcard-b">'
    + '<div class="cols">' + weeks.map(function(w){
        return '<div class="col'+(w.now?" now":"")+'"><span class="cv">'+(w.n||"")+'</span>'
          + '<span class="bar" style="height:'+(w.n/wMax*76)+'%"></span>'
          + '<span class="cl">'+w.label+'</span></div>';
      }).join("") + '</div></div></div>';

  /* attention list */
  const worst = overdue.slice().sort((a,b)=>ageDays(b.submitted)-ageDays(a.submitted)).slice(0,6);
  h += '<div class="dcard wide"><div class="dcard-h">Los que más esperan — arrancá por acá</div>';
  h += worst.length ? worst.map(function(t){
      return '<button class="attn-row" data-go="'+esc(t.id)+'">'
        + '<span class="d">'+ageDays(t.submitted)+'d</span>'
        + '<span class="nm"><b>'+esc(t.location||t.id)+'</b>'
        + '<span>'+esc(tituloDe(t))+' · '+esc(catLabel(t.category))+' · '+esc(t.assignee||"Sin asignar")+'</span></span>'
        + priHTML(t.priority)+staHTML(t.status)+'</button>';
    }).join("") : '<div class="dempty">No hay nada atrasado en este recorte. 👍</div>';
  h += '</div>';

  h += '</div>';

  /* filtering redraws the whole panel, so keep the reader where they were */
  const keep = $("#dashBody").scrollTop;
  $("#dashBody").innerHTML = h;
  $("#dashBody").scrollTop = keep;
}

function kpi(viewId, label, value, sub, cls, unit, reachable){
  const on = ui.view === viewId;
  /* clickable while it leads somewhere, and always clickable when it is the one to switch off */
  const live = on || reachable > 0;
  return '<button class="kpi'+(cls?" "+cls:"")+(on?" on":"")+(live?" click":" off")+'"'
    + (live?' data-kpi="'+viewId+'"':' disabled')
    + ' title="'+(on?"Tocá para quitar este filtro":(live?"Tocá para ver solo estos":"Nada para mostrar"))+'">'
    + '<div class="k">'+label+'</div>'
    + '<div class="v">'+value+(unit?'<small>'+unit+'</small>':'')+'</div>'
    + '<div class="s">'+sub+'</div></button>';
}

/* one place that changes a filter: picking the same value again clears it */
function setFilter(dim, value){
  ui[dim] = (ui[dim] === value) ? "all" : value;
  refresh();
}


function closeSidebar(){
  $("#side").classList.remove("on");
  $("#scrim").classList.remove("on");
}

/* show either the dashboard or the list+detail pair */
function applyMode(){
  document.querySelector(".app").classList.toggle("on-dash", ui.mode==="dashboard");
}
/* redraw after any change to the filters */
function refresh(){
  renderBell();
  renderNotifs();
  applyMode();
  renderSide();
  if(ui.mode==="dashboard"){ renderDash(); return; }
  renderList();
  if(!visible().some(t=>t.id===ui.selected)) selectFirst(); else renderDetail();
}

function select(id){
  const cambio = ui.selected !== id;
  ui.selected = id;
  renderList(); renderDetail();
  if(cambio){ otros = []; avisado = null; latido(); programarLatido(); }
  if(isNarrow()) $("#detail").classList.add("on");
  const el = $('#list .item[data-id="'+id+'"]');
  if(el) el.scrollIntoView({block:"nearest"});
}
function selectFirst(){
  const list = visible();
  if(!isNarrow() && list.length) select(list[0].id);
  else { ui.selected = null; renderList(); renderDetail(); }
}

/* ================= new ticket ================= */
function openModal(){
  $("#nCategory").innerHTML = CATEGORIES.map(c=>'<option value="'+esc(c)+'">'+esc(catLabel(c))+'</option>').join("");
  $("#nPriority").innerHTML = PRIORITIES.map(p=>'<option value="'+p.id+'"'+(p.id==="medium"?" selected":"")+'>'+p.label+'</option>').join("");
  $("#nBuilding").innerHTML = optsEdificio("");
  $("#nDate").value = todayISO();
  ["#nCustomer","#nEmail","#nPhone","#nUnit","#nAssignee","#nDesc","#nTitulo"].forEach(s=>{ $(s).value=""; });
  tituloTocado = false;
  refreshAssigneeList();
  $("#modal").classList.add("on"); $("#modal").setAttribute("aria-hidden","false");
  $("#scrim").classList.add("on");
  setTimeout(()=>$("#nCustomer").focus(),60);
}
function closeModal(){
  $("#modal").classList.remove("on"); $("#modal").setAttribute("aria-hidden","true");
  $("#scrim").classList.remove("on");
}
function refreshAssigneeList(){
  $("#assigneeList").innerHTML = assigneeKeys().filter(k=>k!==NOBODY)
    .map(a=>'<option value="'+esc(a)+'">').join("");
}
/* El titulo se completa solo mientras se escribe el reclamo, salvo que el
   usuario lo haya escrito a mano: ahi no se pisa mas. */
let tituloTocado = false;
function sugerirTitulo(){
  if(tituloTocado) return;
  $("#nTitulo").value = tituloAuto($("#nDesc").value);
}

async function createTicket(){
  const name = $("#nCustomer").value.trim();
  if(!name){ $("#nCustomer").focus(); toast("Hace falta el nombre del reclamante"); return; }
  const edificio = $("#nBuilding").value;
  if(!edificio){ $("#nBuilding").focus(); toast("Elegí el edificio"); return; }
  const desc = $("#nDesc").value.trim();
  /* id provisional: el definitivo lo asigna el servidor, para que dos personas
     creando un ticket a la vez no terminen con el mismo numero */
  const t = {
    id:"TMP-"+Date.now()+"-"+Math.floor(Math.random()*1000), customer:name,
    email:$("#nEmail").value.trim(), phone:$("#nPhone").value.trim(),
    location:armarLoc(edificio, $("#nUnit").value), category:$("#nCategory").value,
    submitted:$("#nDate").value || todayISO(), status:"open",
    priority:$("#nPriority").value, assignee:$("#nAssignee").value.trim(),
    description:desc, titulo:($("#nTitulo").value.trim() || tituloAuto(desc)), notes:[]
  };
  tickets.push(t);
  DIMS.forEach(d=>{ ui[d]="all"; }); ui.mode="tickets"; ui.q=""; $("#q").value="";
  closeModal(); applyMode(); renderSide(); renderList(); refreshAssigneeList(); select(t.id);
  setSync("saving");
  try{
    const d = await api("guardar", {ticket:t});
    stamp = d.stamp || stamp;
    if(ui.selected === t.id) ui.selected = d.id;
    t.id = d.id;
    t.updated_at = d.updated_at || "";
    renderList(); renderDetail(); setSync("ok");
    toast("Ticket "+t.id+" creado");
  }catch(e){
    if(e.message==="sesion") return;
    pushTicket(t);                       /* sin red: queda en cola */
    toast("Ticket creado, se envía al recuperar la conexión");
  }
}

/* ================= import / export ================= */
function download(name, text, type){
  const blob = new Blob([text], {type:type||"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function exportCSV(){
  const cols=["Ticket","Edificio","Unidad","Título","Reclamante","Email","Teléfono","Categoría","Ingresado","Días abierto","Estado","Prioridad","A cargo de","Reclamo","Notas"];
  const q = v => '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const rows = visible().map(t=>[
    t.id,buildingOf(t),unitOf(t),tituloDe(t),t.customer,t.email,t.phone,catLabel(t.category),t.submitted,
    t.status==="resolved"?"":ageDays(t.submitted),
    sta(t.status).label, pri(t.priority).label, t.assignee, t.description,
    (t.notes||[]).map(n=>fmtDate(n.at)+": "+n.text).join(" | ")
  ].map(q).join(","));
  download("ticketflow-"+todayISO()+".csv", "﻿"+cols.map(q).join(",")+"\n"+rows.join("\n"), "text/csv;charset=utf-8");
  toast("Planilla exportada");
}
function backup(){
  download("ticketflow-backup-"+todayISO()+".json",
    JSON.stringify({version:1, saved:new Date().toISOString(), tickets:tickets}, null, 2), "application/json");
  toast("Copia guardada");
}
/* Reemplazo masivo (restore / reset). Solo un admin puede hacerlo. */
async function reemplazarTodo(lista, msg){
  setSync("saving");
  try{
    const d = await api("importar", {tickets:lista});
    stamp = d.stamp || stamp;
    await pull();
    ui.selected = null; refresh(); refreshAssigneeList();
    setSync("ok"); toast(msg);
  }catch(e){
    if(e.message==="sesion") return;
    setSync("pending"); alert("No se pudo reemplazar: "+e.message);
  }
}
function restore(file){
  const r = new FileReader();
  r.onload = function(){
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.tickets)) throw new Error("bad");
      if(!confirm("¿Reemplazar los "+tickets.length+" tickets actuales por los "+d.tickets.length+" tickets de esta copia?")) return;
      reemplazarTodo(d.tickets.map(migrate), "Copia restaurada");
    }catch(e){ alert("No se pudo leer ese archivo como una copia de TicketFlow."); }
  };
  r.readAsText(file);
}

/* ================= theme ================= */
function applyTheme(mode){
  const m = mode || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", m);
  $("#themeIcon").innerHTML = m==="dark"
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>'
    : '<path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>';
}

/* ================= events ================= */
function bind(){
  $("#q").addEventListener("input", function(){
    ui.q = this.value;
    /* searching is about finding a ticket, so leave the dashboard for the list */
    if(ui.mode==="dashboard" && ui.q.trim()){ ui.mode="tickets"; refresh(); return; }
    renderList();
  });

  $("#side").addEventListener("click", function(e){
    const b = e.target.closest("button");
    if(!b) return;
    if(b.dataset.mode!==undefined) ui.mode = b.dataset.mode;
    else if(b.dataset.view!==undefined){ ui.view = b.dataset.view; ui.mode = "tickets"; }
    else if(b.dataset.cat!==undefined) ui.category = b.dataset.cat;
    else return;
    closeSidebar();
    refresh();
  });

  /* the building / handler dropdowns */
  $("#side").addEventListener("change", function(e){
    if(e.target.id === "bldSel") ui.building = e.target.value;
    else if(e.target.id === "whoSel") ui.assignee = e.target.value;
    else return;
    closeSidebar();
    refresh();
  });

  /* open the current dashboard slice as a ticket list, filters intact */
  $("#toList").addEventListener("click", function(){ ui.mode = "tickets"; refresh(); });

  /* clearing a filter chip on the dashboard */
  $("#dashScope").addEventListener("click", function(e){
    const b = e.target.closest("button[data-clear]");
    if(!b) return;
    if(b.dataset.clear === "everything") DIMS.forEach(d=>{ ui[d] = "all"; });
    else ui[b.dataset.clear] = "all";
    refresh();
  });

  /* every figure on the dashboard is also a filter */
  $("#dashBody").addEventListener("click", function(e){
    const go = e.target.closest("button[data-go]");
    if(go){
      ui.mode = "tickets";
      applyMode(); renderSide(); renderList();
      select(go.dataset.go);
      return;
    }
    const el = e.target.closest("[data-kpi],[data-status],[data-pri],[data-cat],[data-who],[data-bld]");
    if(!el) return;
    const d = el.dataset;
    if(d.kpi    !== undefined) return setFilter("view", d.kpi);
    if(d.status !== undefined) return setFilter("view", d.status);
    if(d.pri    !== undefined) return setFilter("priority", d.pri);
    if(d.cat    !== undefined) return setFilter("category", d.cat);
    if(d.who    !== undefined) return setFilter("assignee", d.who);
    if(d.bld    !== undefined) return setFilter("building", d.bld);
  });

  $("#sortSel").addEventListener("change", function(){ ui.sort=this.value; renderList(); });

  $("#list").addEventListener("click", function(e){
    const b = e.target.closest(".item[data-id]");
    if(b) verTicket(b.dataset.id);
    if(b) select(b.dataset.id);
  });

  $("#newBtn").addEventListener("click", openModal);
  $("#mCancel").addEventListener("click", closeModal);
  $("#mSave").addEventListener("click", createTicket);
  $("#nDesc").addEventListener("input", sugerirTitulo);
  $("#nTitulo").addEventListener("input", function(){ tituloTocado = true; });

  $("#sideBtn").addEventListener("click", function(e){
    e.stopPropagation();
    const on = $("#side").classList.toggle("on");
    $("#scrim").classList.toggle("on", on);
  });
  $("#scrim").addEventListener("click", function(){
    closeModal(); $("#side").classList.remove("on"); $("#scrim").classList.remove("on");
  });

  const bell = $("#notifMenu");
  $("#bellBtn").addEventListener("click", function(e){
    e.stopPropagation();
    const abrir = !bell.classList.contains("on");
    bell.classList.toggle("on", abrir);
    if(abrir) renderNotifs();
  });
  bell.addEventListener("click", function(e){ e.stopPropagation(); });
  document.addEventListener("click", function(){ bell.classList.remove("on"); });
  $("#notifAll").addEventListener("click", function(){ marcarLeidas(null); });
  $("#notifList").addEventListener("click", function(e){
    const b = e.target.closest(".notif-item[data-t]");
    if(!b) return;
    bell.classList.remove("on");
    const id = b.dataset.t;
    verTicket(id);
    if(tickets.some(t => t.id === id)){
      if(ui.mode !== "tickets"){ ui.mode = "tickets"; applyMode(); }
      if(!visible().some(t => t.id === id)){ DIMS.forEach(d => { ui[d] = "all"; }); ui.q = ""; $("#q").value = ""; refresh(); }
      select(id);
    }else{
      toast("Ese reclamo ya no est\u00e1 en tu lista");
    }
  });

  const menu = $("#moreMenu");
  $("#moreBtn").addEventListener("click", function(e){ e.stopPropagation(); menu.classList.toggle("on"); });
  document.addEventListener("click", function(){ menu.classList.remove("on"); });
  menu.addEventListener("click", function(e){
    const b = e.target.closest("button[data-act]");
    if(!b) return;
    menu.classList.remove("on");
    const act = b.dataset.act;
    if(act==="csv") exportCSV();
    if(act==="backup") backup();
    if(act==="restore") $("#fileIn").click();
    if(act==="logout") doLogout();
    if(act==="reset"){
      if(!confirm("¿Reemplazar todo por los tickets de ejemplo originales? Se pierde lo que hayas cargado.")) return;
      reemplazarTodo(seed(), "Datos de ejemplo restaurados");
    }
  });
  $("#fileIn").addEventListener("change", function(){ if(this.files&&this.files[0]) restore(this.files[0]); this.value=""; });

  $("#themeBtn").addEventListener("click", function(){
    const next = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
    try{ localStorage.setItem(THEME_KEY,next); }catch(e){}
    applyTheme(next);
  });

  document.addEventListener("keydown", function(e){
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(e.key==="Escape"){ closeModal(); $("#side").classList.remove("on"); $("#scrim").classList.remove("on"); menu.classList.remove("on"); return; }
    if(typing) return;
    if(e.key==="/"){ e.preventDefault(); $("#q").focus(); return; }
    if(e.key==="n"||e.key==="N"){ e.preventDefault(); openModal(); return; }
    if(e.key==="d"||e.key==="D"){ e.preventDefault(); ui.mode="dashboard"; refresh(); return; }
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      if(ui.mode==="dashboard") return;
      const list = visible();
      if(!list.length) return;
      e.preventDefault();
      let i = list.findIndex(t=>t.id===ui.selected);
      i = e.key==="ArrowDown" ? Math.min(list.length-1, i+1) : Math.max(0, i<0?0:i-1);
      select(list[i].id);
    }
  });

  let wasNarrow = isNarrow();
  window.addEventListener("resize", function(){
    const now = isNarrow();
    if(now!==wasNarrow){
      wasNarrow = now;
      if(!now) $("#detail").classList.remove("on");
      if(!now && !ui.selected) selectFirst();
    }
  });
}

/* ================= start ================= */
let savedTheme=null;
try{ savedTheme = localStorage.getItem(THEME_KEY); }catch(e){}
applyTheme(savedTheme);
bind();

$("#gBtn").addEventListener("click", doLogin);
$("#gate").addEventListener("keydown", function(e){ if(e.key==="Enter") doLogin(); });

async function arrancarApp(){
  $("#whoami").textContent = (me && me.nombre) || "";
  try{
    await pull();
  }catch(e){
    if(e.message==="sesion") return;
    setSync("off");
    alert("No se pudieron traer los tickets: "+e.message);
    return;
  }
  renderBell();
  renderNotifs();
  applyMode();
  renderSide();
  renderList();
  refreshAssigneeList();
  selectFirst();
  renderDash();
  $("#dashBody").scrollTop = 0;
  setSync(qSize() ? "pending" : "ok");
  if(qSize()) flush();
  latido();
  programarLatido();
}

(function(){
  let guardado=null;
  try{ guardado = JSON.parse(localStorage.getItem(USER_KEY)||"null"); }catch(e){}
  if(localStorage.getItem(TOKEN_KEY) && guardado){
    me = guardado;
    hideGate();
    arrancarApp();
  }else{
    showGate("");
  }
})();

})();
